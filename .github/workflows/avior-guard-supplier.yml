name: AVIOR Guard supplier RFQ acceptance
on:
  push:
    branches:
      - avior-guard-mcp-pilot
    paths:
      - 'avior-guard-mcp/guarded-supplier-request.mjs'
      - 'avior-guard-mcp/guarded-supplier-strict.mjs'
      - 'avior-guard-mcp/guarded-supplier-request.test.mjs'
      - 'avior-guard-mcp/acceptance-6217.test.mjs'
      - 'avior-guard-mcp/oauth.mjs'
      - 'avior-guard-mcp/oauth-refresh.test.mjs'
      - 'avior-guard-mcp/consent-readiness.test.mjs'
      - 'avior-guard-mcp/oauth-authorization-compat.test.mjs'
      - 'avior-guard-mcp/index-gmail-staged.mjs'
      - 'avior-guard-mcp/gmail-capability.mjs'
      - '.github/workflows/avior-guard-supplier.yml'
  pull_request:
    paths:
      - 'avior-guard-mcp/guarded-supplier-request.mjs'
      - 'avior-guard-mcp/guarded-supplier-strict.mjs'
      - 'avior-guard-mcp/guarded-supplier-request.test.mjs'
      - 'avior-guard-mcp/acceptance-6217.test.mjs'
      - 'avior-guard-mcp/oauth.mjs'
      - 'avior-guard-mcp/oauth-refresh.test.mjs'
      - 'avior-guard-mcp/consent-readiness.test.mjs'
      - 'avior-guard-mcp/oauth-authorization-compat.test.mjs'
      - 'avior-guard-mcp/index-gmail-staged.mjs'
jobs:
  unit-and-acceptance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and real-6217 snapshot regression tests (mock transport; no Gmail)
        run: node --test avior-guard-mcp/guarded-supplier-request.test.mjs avior-guard-mcp/acceptance-6217.test.mjs
      - name: Read-only OAuth refresh regression (no Google API or Gmail sending)
        run: node --test avior-guard-mcp/oauth-refresh.test.mjs avior-guard-mcp/consent-readiness.test.mjs avior-guard-mcp/oauth-authorization-compat.test.mjs
