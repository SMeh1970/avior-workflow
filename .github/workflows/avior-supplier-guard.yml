name: AVIOR Guard — supplier email checks
on:
  push:
    branches: [avior-guard-mcp-pilot]
    paths:
      - "avior-guard-mcp/guarded-supplier-request*.mjs"
      - ".github/workflows/avior-supplier-guard.yml"
  pull_request:
    paths:
      - "avior-guard-mcp/guarded-supplier-request*.mjs"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Supplier request validation tests
        run: node --test avior-guard-mcp/guarded-supplier-request.test.mjs
